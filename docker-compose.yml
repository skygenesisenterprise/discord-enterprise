# Discord Enterprise bot — standalone stack.
# Run from the repository root: docker compose up -d --build
name: discord-enterprise

services:
  discord-enterprise:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DISCORD_ENTERPRISE_VERSION: ${DISCORD_ENTERPRISE_VERSION:-2.0.0}
    image: ${DISCORD_ENTERPRISE_BOT_IMAGE:-ghcr.io/skygenesisenterprise/discord-enterprise}:${DISCORD_ENTERPRISE_BOT_VERSION:-latest}
    container_name: discord-enterprise-bot
    restart: unless-stopped
    # No per-bot env file: the root `.env` (copied from `.env.example`) is the
    # single source, read below by Compose interpolation.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_VERSION: ${DISCORD_ENTERPRISE_VERSION:-2.0.0}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ENTERPRISE_LOG_LEVEL: ${DISCORD_ENTERPRISE_LOG_LEVEL:-info}
      DISCORD_ENTERPRISE_DATA_DIR: /app/bot/data
      DISCORD_ENTERPRISE_DATABASE_PATH: /app/bot/data/discord-enterprise.sqlite3
      DISCORD_ENTERPRISE_HEALTH_PORT: ${DISCORD_ENTERPRISE_HEALTH_PORT:-3010}
      DISCORD_ENTERPRISE_DEPLOY_COMMANDS: ${DISCORD_ENTERPRISE_DEPLOY_COMMANDS:-false}
      DISCORD_ENTERPRISE_DOCS_URL: ${DISCORD_ENTERPRISE_DOCS_URL:-https://docs.discord-enterprise.com}
      DISCORD_ENTERPRISE_SUPPORT_URL: ${DISCORD_ENTERPRISE_SUPPORT_URL:-https://github.com/SkyGenesisEnterprise/discord-enterprise/issues}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${DISCORD_ENTERPRISE_HEALTH_PORT:-3010}:${DISCORD_ENTERPRISE_HEALTH_PORT:-3010}"
    develop:
      watch:
        - action: sync
          path: ./bot
          target: /app/bot
          ignore:
            - .env
            - data/
            - node_modules/
        - action: rebuild
          path: ./packages/discord-framework
    volumes:
      - discord-enterprise-data:/app/bot/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.DISCORD_ENTERPRISE_HEALTH_PORT||3010)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  discord-enterprise-data:
