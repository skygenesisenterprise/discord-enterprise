# Discord Enterprise — pnpm workspace.
#
# Every entry maps to a real package.json in this repository. The directories
# inherited from the former multi-product layout (`apps/*`, `web`,
# `packages/node`, `bot/*`) no longer exist and are intentionally absent.
#
#   .                            root package — shared tooling and dependencies
#   bot                          @discord-enterprise/discord-enterprise (the bot)
#   docs                         @discord-enterprise/docs (Fumadocs site)
#   packages/discord-framework   @discord-enterprise/discord-framework
#   packages/server              @discord-enterprise/server
#   packages/server/src/emails   @discord-enterprise/emails (template preview)

packages:
  - .
  - bot
  - docs
  - packages/*
  - packages/server/src/emails

# No manifest declares a `catalog:` dependency: each package.json owns its own
# version ranges. Defining a catalog here would be dead configuration.

# Only the native modules that are actually part of the dependency graph may
# run build scripts: bcrypt, node-pty, ssh2 (with cpu-features) and esbuild.
allowBuilds:
  bcrypt: true
  cpu-features: true
  esbuild: true
  node-pty: true
  ssh2: true

# Runtime pins consumed by the packages above: better-auth's two helpers and
# the security ranges for transitive protobufjs/tar. The former React 18 and
# esbuild 0.20 overrides were dropped — this workspace uses React 19 and
# esbuild 0.28.
overrides:
  '@better-fetch/fetch': 1.3.1
  better-call: 1.3.7
  protobufjs: '>=7.5.5 <8.0.0'
  tar: '>=7.5.19 <8.0.0'

peerDependencyRules:
  ignoreMissing:
    - typescript

# No agent-skills configuration exists in this repository, so there is no
# `permissions` section to grant.
